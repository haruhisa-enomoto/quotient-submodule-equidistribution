name = "quotient_submodule_equidistribution_verification"
version = "0.1.0"
packagesDir = "../.lake/packages"
defaultTargets = ["ComparatorChallenges"]

[[require]]
name = "quotient_submodule_equidistribution"
path = ".."

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.32.0"

[[lean_lib]]
name = "ComparatorChallenges"
roots = [
  "ComparatorChallenges.MainTheorem",
  "ComparatorChallenges.FirstLastFour",
  "ComparatorChallenges.Nakayama",
  "ComparatorChallenges.RadicalSquareZero",
  "ComparatorChallenges.RepresentationDirected",
]

