version: "v0.3"
project:
  name: "quotient-submodule-equidistribution"
  authors:
    - "Haruhisa Enomoto"
  license: "Apache-2.0"

sources:
  - title: "An equidistribution conjecture for quotient-closed and submodule-closed subcategories"
    authors:
      - "Haruhisa Enomoto"
    id: "arXiv:ARXIV_ID_PENDING"
    url: "https://arxiv.org/abs/ARXIV_ID_PENDING"
    publication_date: "2026-08-03"
    type: "paper"
    author_contacted: "yes"

status:
  scope: >-
    The universal quotient-submodule equidistribution conjecture is stated but remains open.  The main theorem
    proves equidistribution for four classes: at most nine indecomposable
    right modules, Nakayama algebras, radical-square-zero algebras, and
    representation-directed algebras.  The representation-directed branch
    constructs the relevant ideal quotient and identifies the selected mixed
    coordinates with dimensions of its Hom spaces.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    - "bv_decide-generated native certificate-checking axioms for the first/last-four branch; see TRUST.md"
  main_results:
    - name: "Main four-case theorem"
      declaration: "QuotientSubmoduleEquidistribution.MainTheoremEndpoint.rightQuotientSubmoduleEquidistribution"
      file: "QuotientSubmoduleEquidistribution/RepresentationTheory/MainTheoremEndpoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound", "bv_decide-generated native certificate-checking axioms; see TRUST.md"]
    - name: "First and last four coefficients"
      declaration: "QuotientSubmoduleEquidistribution.BottomLevels.FiniteDimensionalRecurrence.FirstLastFourEndpoint.bottom_top_four"
      file: "QuotientSubmoduleEquidistribution/RepresentationTheory/FirstLastFourEndpoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound", "bv_decide-generated native certificate-checking axioms; see TRUST.md"]
    - name: "At most nine indecomposable modules"
      declaration: "QuotientSubmoduleEquidistribution.BottomLevels.FiniteDimensionalRecurrence.FirstLastFourEndpoint.equidistribution_of_card_le_nine"
      file: "QuotientSubmoduleEquidistribution/RepresentationTheory/FirstLastFourEndpoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound", "bv_decide-generated native certificate-checking axioms; see TRUST.md"]
    - name: "Nakayama case"
      declaration: "QuotientSubmoduleEquidistribution.NakayamaAlgebraProductFormula.rightQuotientSubmoduleEquidistribution"
      file: "QuotientSubmoduleEquidistribution/RepresentationTheory/NakayamaAlgebraProductFormula.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "verification/ComparatorChallenges/Nakayama.json"
    - name: "Radical-square-zero case"
      declaration: "QuotientSubmoduleEquidistribution.RadicalSquareZero.rightQuotientSubmoduleEquidistribution_of_squareZero"
      file: "QuotientSubmoduleEquidistribution/RadicalSquareZero/SeparatedDirectedInterface.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "verification/ComparatorChallenges/RadicalSquareZero.json"
    - name: "Representation-directed case"
      declaration: "QuotientSubmoduleEquidistribution.rightRepresentationDirected_quotientSubmoduleEquidistribution"
      file: "QuotientSubmoduleEquidistribution/RepresentationDirected/AlgebraEndpoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "verification/ComparatorChallenges/RepresentationDirected.json"

review:
  status: "Production sources compile with the pinned toolchain; MainResults.lean checks the public declarations and Audit.lean prints their axiom sets"

automation:
  methods: []
  notes: "The corresponding manuscript and formalization commits are recorded in PROVENANCE.md."
